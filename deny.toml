# cargo-deny policy. Run locally with `just deny`; CI runs the same checks in the
# `licenses` job of .github/workflows/ci.yml.
#
# Serialist is MIT OR Apache-2.0. GPL code (Zed's terminal, settings, theme and ui
# crates, Baudrun) must never enter the dependency tree, so the license list below is
# an allow-list of permissive licenses plus MPL-2.0 (file-level copyleft). Anything not
# listed, including GPL, LGPL and AGPL, fails the check. Do not add a license here
# without checking that it is compatible with MIT OR Apache-2.0 distribution.

[graph]
# No `targets` filter: check the dependencies of every platform, because CI builds on
# macOS, Linux and Windows and the Linux-only and Windows-only crates must pass too.

[advisories]
# A new RUSTSEC entry must not block unrelated work, so CI runs the advisories check
# as a non-blocking step. cargo-deny has no warn level for vulnerabilities, so the
# softening lives in ci.yml, not here. Read the output when it goes red.
yanked = "warn"
# GPUI's transitive tree is not ours to fix; only flag unmaintained direct dependencies.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "CC0-1.0",
    "BSL-1.0",
    # Permissive licenses that transitive dependencies of gpui-kit use. 0BSD:
    # enum-iterator. bzip2-1.0.6: libbz2-rs-sys, via compression-codecs.
    "0BSD",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Turned on later, once the dependency set settles.
wildcards = "allow"
highlight = "all"
