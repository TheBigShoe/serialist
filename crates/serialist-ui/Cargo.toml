[package]
name = "serialist-ui"
description = "GPUI views for Serialist."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serialist-core.workspace = true
serialist-sim.workspace = true
# gpui-kit re-exports GPUI and its platform crate, and GPUI's macros resolve through it,
# so GPUI is not listed separately. Code reaches all of it through `prelude`.
gpui-kit.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
regex.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
proptest.workspace = true

# Measures the terminal element with the platform's real text system, which on macOS
# must be created on the main thread, so it runs as a plain binary.
[[test]]
name = "terminal_frame_cost"
harness = false
