[package]
name = "serialist-sim"
description = "Hardware-free test doubles for Serialist: virtual links, simulated devices, fake port source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serialist-core.workspace = true
crossbeam-channel.workspace = true
memchr.workspace = true
parking_lot.workspace = true
rand.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# `cargo llvm-cov` builds with `--cfg coverage`; the tests that hold a wall-clock budget
# skip it then (see the coverage job in .github/workflows/ci.yml).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[[bench]]
name = "link_throughput"
harness = false
