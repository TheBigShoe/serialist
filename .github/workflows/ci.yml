name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A new push cancels the previous run, except on main, where every
# commit should get a verdict and finish warming the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep file and line info for backtraces but drop full debuginfo: it dominates the
  # size of target/ and the cache, and nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cold builds are long: gpui-pre, wgpu and gpui-kit compile from scratch on every
    # runner when the cache misses. Warm runs are much shorter.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain needs an explicit version and does not read
      # rust-toolchain.toml. With no arguments rustup installs the toolchain,
      # components and channel pinned in that file, so there is one source of truth.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal --no-self-update

      # Only main saves the cache; PRs restore it. Three OS caches of a GPUI build are
      # large, and PR caches would evict main's from the repository's 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # System libraries for the GPUI Linux backend (wgpu with Wayland and X11).
      # Sources: zed-industries/zed script/linux and longbridge/gpui-kit
      # script/install-linux.sh. Both list libwayland-dev, libxkbcommon-x11-dev,
      # libx11-xcb-dev, libfontconfig-dev and libvulkan1. Build-time links: xkbcommon
      # (libxkbcommon, libxkbcommon-x11) and fontconfig via pkg-config. libudev-dev is
      # for serialport's default libudev feature, which lands with the transport work.
      # libasound2-dev is Zed's audio dependency and nothing in our tree uses ALSA.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libudev-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # No serial hardware on any runner. Hardware tests are #[ignore] and stay skipped.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # The WebAssembly plugin tier (serialist-plugins' `wasm` feature: wasmtime and
  # Cranelift) is off by default, so the test job never builds it; this job does, on one
  # OS. The plugins run from the committed builds in serialist-plugins/tests/fixtures.
  # The wasm32-wasip2 target is deliberately not installed: the test that rebuilds those
  # plugins and compares bytes is only known to be reproducible on one host OS, so here
  # it skips with a message. `just wasm-fixtures` refreshes the builds locally.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # serialport's libudev feature, through serialist-core. No GPUI here.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Clippy (wasm feature)
        run: cargo clippy -p serialist-plugins --features wasm --all-targets --locked -- -D warnings

      - name: Test (wasm feature)
        run: cargo test -p serialist-plugins --features wasm --locked --no-fail-fast

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Licenses and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
          arguments: --all-features

      # cargo-deny has no warn level for vulnerabilities, so the advisories check is
      # made non-blocking here: a new RUSTSEC entry shows as a failed step but does not
      # fail the workflow. Licenses and bans above are hard failures.
      - name: Advisories (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features

  # Fuzzing with cargo-fuzz (libFuzzer) on nightly. fuzz/ is its own workspace outside
  # the root one, with its own Cargo.lock (fuzz/Cargo.toml says why), so the jobs above
  # never build it. The seeds, and every crash reproducer committed with them in
  # fuzz/seeds/<target>/, replay first on the pinned stable toolchain; then each target
  # runs for FUZZ_SECONDS from those seeds. `--no-cfg-fuzzing`: nusb 0.2's `cfg(fuzzing)`
  # code does not compile. `just fuzz-check` and `just fuzz <target>` do the same locally.
  # The corpus the runs find is cached between runs (the cache steps below), and
  # fuzz-nightly.yml runs the same loop for longer on a schedule, on the same cache.
  fuzz:
    runs-on: ubuntu-latest
    # A cold rust-cache compiles wasmtime (race_wasm's dependency) for clippy, for the
    # tests and for the instrumented build, which is most of the job. Raised from 45
    # without a timing from a hosted runner; a warm run needs a fraction of it.
    timeout-minutes: 75
    env:
      FUZZ_SECONDS: 60
    steps:
      - uses: actions/checkout@v7

      # The pinned stable toolchain (rust-toolchain.toml) for the checks and the seed
      # replay, and nightly for cargo-fuzz's instrumented build.
      - name: Install toolchains
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup toolchain install nightly --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # serialport's libudev feature, through serialist-core. No GPUI here.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # install-action ships cargo-fuzz as a static musl binary, and cargo-fuzz's default
      # --target is the triple it was built for. Left alone it would build the targets for
      # x86_64-unknown-linux-musl, which has no std installed here and cannot run
      # AddressSanitizer, so every build and run names the host triple.
      - name: Fuzz target triple
        run: |
          echo "FUZZ_TARGET=$(rustc +nightly -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      # cargo-fuzz has no --locked; this fails if fuzz/Cargo.lock is out of date.
      - name: Check fuzz/Cargo.lock
        run: cargo fetch --manifest-path fuzz/Cargo.toml --locked

      # The race_wasm target is behind the fuzz crate's `wasm` feature (wasmtime). The tests
      # run twice: without it, as a plain build sees the crate, and with it, which adds that
      # target and replays its seeds. Clippy covers both with --all-features.
      - name: Format, clippy and seed replay (stable)
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path fuzz/Cargo.toml --locked
          cargo test --manifest-path fuzz/Cargo.toml --locked --features wasm

      # `--features wasm` here and in the run and cmin steps below, always together: it
      # builds race_wasm (cargo skips a target whose required feature is off, and `fuzz
      # list` lists it regardless), and cargo-fuzz rebuilds every target when the features
      # of a run differ from the build's. wasmtime makes this build the long part of the
      # job when the rust-cache has nothing for it.
      - name: Build fuzz targets (nightly)
        run: cargo +nightly fuzz build --fuzz-dir fuzz --no-cfg-fuzzing --features wasm --target "$FUZZ_TARGET"

      # 60 s per target only goes deep if each run starts where the last one stopped, so
      # the corpus (fuzz/corpus, not committed) is cached. A cache entry cannot be
      # overwritten, so the key is unique per run and restore-keys picks the newest entry
      # with the prefix: the last push to main, or the last nightly run, which shares this
      # prefix. No entry yet is not an error; the seeds in fuzz/seeds replay regardless.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      # Every target runs even when an earlier one crashes; the step fails at the end. A
      # target with a libFuzzer dictionary in fuzz/dicts/<target>.dict gets it.
      - name: Fuzz each target for ${{ env.FUZZ_SECONDS }} s
        id: fuzz
        run: |
          targets=$(cargo +nightly fuzz list --fuzz-dir fuzz)
          if [ -z "$targets" ]; then
            echo "No fuzz targets."
            exit 0
          fi
          failed=""
          for target in $targets; do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target"
            args=(-max_total_time="$FUZZ_SECONDS" -rss_limit_mb=1024 -malloc_limit_mb=256 -timeout=10)
            if [ -f "fuzz/dicts/$target.dict" ]; then
              args+=(-dict="fuzz/dicts/$target.dict")
            fi
            cargo +nightly fuzz run --fuzz-dir fuzz --no-cfg-fuzzing --features wasm --target "$FUZZ_TARGET" "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" -- "${args[@]}" \
              || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Fuzz targets failed:$failed. The reproducers are in the fuzz-artifacts artifact."
            exit 1
          fi

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # Pull requests read the cache and main writes it, as with the rust-cache steps: a PR
      # entry is never read by main and would only crowd the repository's 10 GB limit. Both
      # steps also run after a crash, because what a run found before it crashed is worth
      # keeping, and are skipped when the loop never started (a failed build). The merge
      # keeps the inputs that add coverage and drops the rest, so the saved corpus stays
      # small. cargo-fuzz exits 0 when the merge itself fails and leaves the corpus as it
      # was; the corpus is then saved unminimized.
      - name: Minimize the fuzz corpus
        if: always() && github.ref == 'refs/heads/main' && steps.fuzz.outcome != 'skipped'
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz cmin --fuzz-dir fuzz --no-cfg-fuzzing --features wasm --target "$FUZZ_TARGET" "$target" \
              "fuzz/corpus/$target" -- -rss_limit_mb=1024 -malloc_limit_mb=256 -timeout=10 \
              || echo "::warning::Could not minimize the corpus of $target; saving it as it is."
            echo "::endgroup::"
          done

      - name: Save the fuzz corpus
        if: always() && github.ref == 'refs/heads/main' && steps.fuzz.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

  # Line coverage with cargo-llvm-cov, failing below two floors: 87% for the workspace and
  # 90% for serialist-core (the plan's proposal). Measured on macOS at 8f77082: 90.5% and
  # 94.2%; Linux runs different platform code, hence the margin. Only Linux: the floors
  # guard the trend, and one instrumented GPUI build is enough. The lcov report is kept as
  # an artifact for local viewers and review tools. `just coverage` runs the same steps.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Every crate but serialist-core, for the core floor.
      NOT_CORE: crates/serialist-(sim|script|plugins|plugin-sdk|ui|vt)/|crates/serialist/|examples/
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The same packages as the test job: the UI crate's tests run here too.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libudev-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The store gate's timing budget is for uninstrumented builds and has failed under
      # coverage on a loaded machine (11.8 s against 10 s). The test job runs it in full.
      - name: Tests under coverage
        run: cargo llvm-cov --workspace --locked --no-report --no-fail-fast -- --skip one_million_lines_gate

      - name: Coverage floor, workspace (lines)
        run: cargo llvm-cov report --summary-only --fail-under-lines 87

      - name: Coverage floor, serialist-core (lines)
        run: cargo llvm-cov report --summary-only --fail-under-lines 90 --ignore-filename-regex "$NOT_CORE"

      - name: lcov report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # The criterion benches (store append, parse, line lookup, search; the virtual link and
  # firehose): every [[bench]] target in the workspace. The timing gates that hold the
  # budgets (the store gate, the terminal frame cost, the VT firehose) stay in `cargo
  # test`. `just bench` and `just bench-compare` run the same commands locally.
  #
  # On a push to main the benches run with --quick: a smoke test that they build and run.
  # Hosted runners are too noisy for absolute numbers, and --quick is too noisy for a
  # comparison: two runs of identical code differed by 20% on one bench.
  #
  # On a pull request they are a regression check instead. The base commit and the head
  # are benchmarked one after the other on this runner, with fuller sampling, into one
  # criterion directory, and .github/scripts/bench_regressions.py reads the change that
  # criterion computed for each bench. A bench regresses when it is confidently more than
  # 30% slower (the lower bound of the confidence interval on the change in its median
  # time is past 30%). Each regressed bench is then measured again, base and head, alone
  # and at criterion's default sampling; the job fails only if it regresses in both rounds.
  # Not covered: a bench that is new in the PR has no base, so it is measured but not
  # compared, and a regression under 30% passes.
  #
  # The base builds in base/target, never in the head's target/. The two checkouts are the
  # same cargo packages at the same relative paths, so a shared target directory gives
  # their crates the same hashes, and cargo decides what is stale by file modification
  # time: after the base is built, the head's older files look up to date and the "head"
  # run executes the base's binaries (seen: `Finished` in 1.3 s, same executable). The
  # price is compiling the dependencies a second time.
  bench:
    runs-on: ubuntu-latest
    # A pull request builds the benches twice (the dependencies too, for the base), runs
    # the suite twice with --warm-up-time 1 --measurement-time 3, then measures every
    # regressed bench again. The limit leaves room for the suite to grow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Self-test the regression script
        run: python3 .github/scripts/bench_regressions.py --self-test

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # serialport's libudev feature, through serialist-core. No GPUI here.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Benches (quick)
        if: github.event_name != 'pull_request'
        run: cargo bench --workspace --locked --bench '*' -- --quick

      # Everything below is for pull requests.

      # After rust-cache: its cache key hashes the Cargo files it finds in the workspace,
      # and a second checkout in base/ would give PRs a different key from main's.
      - name: Check out the base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # One directory for both runs, so each bench's `base` baseline and its `change`
      # estimate are side by side. Set here because job-level env cannot use runner.temp.
      - name: Keep criterion's results in one directory
        if: github.event_name == 'pull_request'
        run: echo "CRITERION_HOME=$RUNNER_TEMP/criterion" >> "$GITHUB_ENV"

      # `cargo bench --bench '*'` is an error when nothing matches, as it would at a base
      # that predates the benches. The base's own rust-toolchain.toml is installed too,
      # in case the PR changes it.
      - name: Look for benches at the base commit
        id: base
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          rustup toolchain install --profile minimal --no-self-update
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          if grep -q '"kind":\["bench"\]' <<< "$metadata"; then
            echo "benches=true" >> "$GITHUB_OUTPUT"
          else
            echo "benches=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base commit has no bench targets: nothing to compare with."
          fi

      # Builds in base/target (the default for this directory); see the job comment.
      - name: Benches at the base commit
        if: github.event_name == 'pull_request' && steps.base.outputs.benches == 'true'
        working-directory: base
        run: cargo bench --workspace --locked --bench '*' -- --save-baseline base --warm-up-time 1 --measurement-time 3

      # --baseline-lenient: a bench that is new in this PR has no baseline. It is
      # measured, not failed.
      - name: Benches at the head
        if: github.event_name == 'pull_request' && steps.base.outputs.benches == 'true'
        run: cargo bench --workspace --locked --bench '*' -- --baseline-lenient base --warm-up-time 1 --measurement-time 3

      # The script exits 0 when nothing regressed, 1 for a regression and 2 when its input
      # is not criterion's. Only 1 earns the second round; the second round measures each
      # regressed bench by itself (--exact: criterion's filter is a regex otherwise).
      - name: Check for regressions
        if: github.event_name == 'pull_request' && steps.base.outputs.benches == 'true'
        run: |
          regressed="$RUNNER_TEMP/regressed.txt"
          echo "## Round 1: every bench" >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 .github/scripts/bench_regressions.py "$CRITERION_HOME" --write-ids "$regressed" || status=$?
          [ "$status" -eq 1 ] || exit "$status"

          echo "::warning::Round 1: past the threshold, measuring again: $(paste -sd' ' "$regressed")"
          while IFS= read -r id; do
            echo "::group::Round 2: $id"
            (cd base && cargo bench --workspace --locked --bench '*' -- --save-baseline base --exact "$id" < /dev/null)
            cargo bench --workspace --locked --bench '*' -- --baseline base --exact "$id" < /dev/null
            echo "::endgroup::"
          done < "$regressed"
          echo "## Round 2: the benches that regressed, measured again" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/bench_regressions.py "$CRITERION_HOME" --only "$regressed"
