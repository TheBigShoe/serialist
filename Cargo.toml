[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["John Gunn <gunn.johnj@gmail.com>"]

[workspace.dependencies]
serialist-core = { path = "crates/serialist-core" }
serialist-sim = { path = "crates/serialist-sim" }
serialist-script = { path = "crates/serialist-script" }
serialist-plugins = { path = "crates/serialist-plugins" }
serialist-ui = { path = "crates/serialist-ui" }

# GPUI: the community snapshot pinned by gpui-kit. Import it only through serialist_ui::prelude.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }
gpui-kit = "=0.7.0"

serialport = "4.10"
nusb = "0.2"
crossbeam-channel = "0.5"
async-channel = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
chrono = "0.4"
memchr = "2"
vte = "0.15"
notify = "8"
notify-debouncer-full = "0.7"
rand = "0.9"
proptest = "1"
criterion = "0.5"
insta = "1"

[profile.release]
opt-level = 3
lto = "thin"

# Keep debug builds usable for stress testing without a full release build.
[profile.dev.package."*"]
opt-level = 2
